<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
    window.TrackJS && TrackJS.install({
      token: "da4c33f5e20b48efacf8627274290cbf"
    });
  </script>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <fieldset>
      <legend>Calculation History</legend>
      <!-- Comment out the line below to trigger a TypeError in the try block -->
      <ul id="history"></ul>
    </fieldset>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
    // ---------------------------------------------------------------------------
    // Custom error hierarchy
    // ---------------------------------------------------------------------------

    // Base class — attaches the raw expression to every calculator error so the
    // catch block always has context without having to re-read the DOM.
    class CalculationError extends Error {
      constructor(message, firstNum, operator, secondNum) {
        super(message);
        this.name = 'CalculationError';
        this.expression = `${firstNum} ${operator} ${secondNum}`;
      }
    }

    // Thrown when one or both inputs cannot be parsed as a number.
    class InvalidInputError extends CalculationError {
      constructor(firstNum, operator, secondNum) {
        super(
          `"${firstNum}" and "${secondNum}" are not both valid numbers.`,
          firstNum, operator, secondNum
        );
        this.name = 'InvalidInputError';
      }
    }

    // Thrown specifically for division by zero so the catch block can give a
    // more targeted message than a generic calculation failure.
    class DivisionByZeroError extends CalculationError {
      constructor(firstNum, secondNum) {
        super(
          `Cannot divide ${firstNum} by zero.`,
          firstNum, '/', secondNum
        );
        this.name = 'DivisionByZeroError';
      }
    }

    // ---------------------------------------------------------------------------
    // Calculator
    // ---------------------------------------------------------------------------

    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');

      try {
        let firstNum = document.querySelector('#first-num').value.trim();
        let secondNum = document.querySelector('#second-num').value.trim();
        let operator = document.querySelector('#operator').value;

        if (firstNum === '' || secondNum === '') {
          throw new Error('Both number fields are required.');
        }
        if (isNaN(firstNum) || isNaN(secondNum)) {
          throw new InvalidInputError(firstNum, operator, secondNum);
        }
        if (operator === '/' && Number(secondNum) === 0) {
          throw new DivisionByZeroError(firstNum, secondNum);
        }

        let result = eval(`${firstNum} ${operator} ${secondNum}`);
        output.innerHTML = result;

        // Append to history — comment out <ul id="history"> in the HTML to trigger a TypeError here
        let historyList = document.querySelector('#history');
        let item = document.createElement('li');
        item.textContent = `${firstNum} ${operator} ${secondNum} = ${result}`;
        historyList.appendChild(item);

      } catch (err) {
        // Use instanceof to tailor the response to each specific error type.
        if (err instanceof DivisionByZeroError) {
          output.innerHTML = `Math error: ${err.message}`;
          console.error(`[${err.name}] Expression: "${err.expression}" —`, err.message);
        } else if (err instanceof InvalidInputError) {
          output.innerHTML = `Input error: ${err.message}`;
          console.error(`[${err.name}] Expression: "${err.expression}" —`, err.message);
        } else {
          // Catches built-in errors (e.g. TypeError from missing #history element)
          output.innerHTML = `Error: ${err.message}`;
          console.error(`[${err.name}]`, err.message);
        }

      } finally {
        console.log('Calculation attempt finished. Inputs preserved in form.');
      }
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish

    const sampleData = { name: 'Ada Lovelace', role: 'Programmer', year: 1843 };

    // Console Log
    errorBtns[0].addEventListener('click', () => {
      console.log('Console Log demo:', sampleData);
    });

    // Console Error
    errorBtns[1].addEventListener('click', () => {
      console.error('Console Error demo: something went wrong!', sampleData);
    });

    // Console Count
    errorBtns[2].addEventListener('click', () => {
      console.count('button-clicks');
    });

    // Console Warn
    errorBtns[3].addEventListener('click', () => {
      console.warn('Console Warn demo: this is a warning', sampleData);
    });

    // Console Assert
    errorBtns[4].addEventListener('click', () => {
      console.assert(1 === 2, 'Console Assert demo: assertion failed — 1 does not equal 2');
    });

    // Console Clear
    errorBtns[5].addEventListener('click', () => {
      console.clear();
    });

    // Console Dir
    errorBtns[6].addEventListener('click', () => {
      console.dir(document.querySelector('form'));
    });

    // Console dirxml
    errorBtns[7].addEventListener('click', () => {
      console.dirxml(document.querySelector('form'));
    });

    // Console Group Start
    errorBtns[8].addEventListener('click', () => {
      console.group('Demo Group');
      console.log('Inside the group — name:', sampleData.name);
      console.log('Inside the group — role:', sampleData.role);
    });

    // Console Group End
    errorBtns[9].addEventListener('click', () => {
      console.groupEnd();
    });

    // Console Table
    errorBtns[10].addEventListener('click', () => {
      const tableData = [
        { name: 'Ada Lovelace',   role: 'Programmer',     year: 1843 },
        { name: 'Alan Turing',    role: 'Computer Scientist', year: 1936 },
        { name: 'Grace Hopper',   role: 'Compiler Pioneer', year: 1952 },
      ];
      console.table(tableData);
    });

    // Start Timer
    errorBtns[11].addEventListener('click', () => {
      console.time('demo-timer');
      console.log('Timer started — press "End Timer" to stop it.');
    });

    // End Timer
    errorBtns[12].addEventListener('click', () => {
      console.timeEnd('demo-timer');
    });

    // Console Trace
    errorBtns[13].addEventListener('click', () => {
      console.trace('Console Trace demo');
    });

    // Trigger a Global Error — caught locally to log, then re-thrown so it
    // bubbles up to window.onerror and gets captured by TrackJS
    errorBtns[14].addEventListener('click', () => {
      try {
        throw new CalculationError('Uncaught global error triggered intentionally', '', '', '');
      } catch (err) {
        console.log('Global error caught before re-throwing:', err);
        throw err;
      }
    });
  </script>
</body>

</html>
